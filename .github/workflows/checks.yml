name: Template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LOAD_DOTENV: 'false'
      PAID_AI_ENABLED: 'false'
      PORTFOLIO_PROFILE: config/profile.example.json
      CONTENT_MANIFEST: config/content.example.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: npm --prefix services/frontend ci --ignore-scripts
      - run: python -m pytest -q
      - run: npm --prefix services/frontend run typecheck
      - run: npm --prefix services/frontend test
      - run: npm --prefix services/frontend run build
      - run: python scripts/release_check.py
  optional-stack:
    runs-on: ubuntu-latest
    env:
      LOAD_DOTENV: 'false'
      PAID_AI_ENABLED: 'false'
      PORTFOLIO_PROFILE: config/profile.example.json
      CONTENT_MANIFEST: config/content.example.json
      RUN_STACK_SERVICE_TESTS: 'true'
      # Synthetic, isolated CI services only; never production credentials.
      STACK_TEST_DATABASE_URL: postgresql://portfolio_ci:ci-only-test-password@127.0.0.1:5432/portfolio_ci
      STACK_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      STACK_TEST_NEO4J_PASSWORD: ci-only-test-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio_ci
          POSTGRES_DB: portfolio_ci
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_ci -d portfolio_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-test-password 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training and optional runtime dependencies
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/api/requirements-dev.txt -r services/api/requirements-stack.txt -r services/gnn/requirements.txt
      - run: python -m pytest -q tests/test_stack.py tests/test_stack_services.py
      - run: python scripts/showcase.py demo --epochs 12
